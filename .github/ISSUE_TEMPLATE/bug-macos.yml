name: Ошибка в версии для macOS
description: Что-то не работает в Ludex на macOS — падает, не запускается, не находит игры
title: "[macOS] "
labels: ["bug", "macos"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке. Чем точнее детали, тем быстрее починим.

        **Перед созданием issue проверьте три вещи:**
        1. Версия Ludex — 1.5.0 или новее (см. «Версия» в настройках приложения).
        2. Сборка не подписана Apple, поэтому первый запуск — **правый клик по Ludex → «Открыть» → «Открыть»**.
           Если macOS не даёт открыть приложение вообще, это ожидаемое поведение Gatekeeper, а не баг.
        3. Приложение запущено из папки «Программы» (Applications), а не из DMG-образа напрямую.

  - type: input
    id: version
    attributes:
      label: Версия Ludex
      description: Настройки → «О программе» внизу, или имя скачанного файла
      placeholder: "1.5.0"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Процессор
      description: Яблочко → «Об этом Mac» → «Чип»
      options:
        - Apple Silicon (M1 / M2 / M3 / M4)
        - Intel
        - Не знаю
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: Версия macOS
      placeholder: "14.5 Sonoma"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Откуда взяли сборку
      options:
        - Ludex-1.5.0-macos-arm64.dmg (Apple Silicon)
        - Ludex-1.5.0-macos-x64.dmg (Intel)
        - Ludex-1.5.0-macos-arm64.zip
        - Ludex-1.5.0-macos-x64.zip
        - Собрал сам из исходников
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: Что не работает
      options:
        - Приложение не запускается
        - Запускается, но падает или зависает
        - Не находит игры в указанной папке
        - Не скачиваются обложки
        - Неправильно запускается игра
        - Другое (опишу ниже)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Что вы делали
      description: По шагам — так ошибку можно повторить
      placeholder: |
        1. Открыл DMG, перетащил Ludex в «Программы»
        2. Запустил через правый клик → «Открыть»
        3. Шестерёнка → «Папки с играми» → добавил ~/Games
        4. Нажал «Сканировать»
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
      placeholder: В библиотеке должно появиться 12 игр
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что произошло на самом деле
      description: Текст ошибки, что видно на экране, сколько игр нашлось
    validations:
      required: true

  - type: textarea
    id: terminal
    attributes:
      label: Вывод при запуске из Терминала
      description: |
        Запустите приложение командой ниже и вставьте вывод — часто там видна настоящая причина:
        ```
        /Applications/Ludex.app/Contents/MacOS/Ludex
        ```
      render: shell
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Лог приложения
      description: |
        Файл `~/Library/Application Support/Ludex/log.txt` — откройте и вставьте последние строки.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты
      description: Перетащите картинки сюда — они сильно помогают
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Проверено
      options:
        - label: Версия Ludex — 1.5.0 или новее
          required: true
        - label: Пробовал запустить через правый клик → «Открыть» (обход Gatekeeper)
          required: true
        - label: Приложение лежит в «Программах», а не в DMG
          required: false
        - label: Токены и личные данные из лога убрал
          required: false
