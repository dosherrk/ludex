name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Ludex.sln

      - name: Build (Release)
        run: dotnet build Ludex.sln -c Release --no-restore

      # Скрипт сам собирает Windows (NSIS), Linux (tar.gz + deb) и macOS (.app в zip)
      # для тега — но на каждый пуш достаточно проверки сборки выше.
      - name: Упаковка для всех платформ
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis imagemagick icnsutils zip
          ./build.sh all

      - name: Артефакты сборки
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Ludex-all-platforms
          path: |
            release/*.exe
            release/*.zip
            release/*.tar.gz
            release/*.deb
          if-no-files-found: error
