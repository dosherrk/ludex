name: catalog

# Раз в сутки собирает полный каталог игр Steam и публикует готовые файлы
# на GitHub Pages, чтобы приложению не приходилось обходить магазин самому.
#
# Результат:
#   https://dosherrk.github.io/ludex/catalog.ru.json.gz  (~5 МБ, ~130 тыс. игр, описания по-русски)
#   https://dosherrk.github.io/ludex/catalog.en.json.gz  (~4 МБ, то же по-английски)
#   https://dosherrk.github.io/ludex/catalog.json.gz     (копия русской — для версий до 1.19)
#   https://dosherrk.github.io/ludex/catalog.meta.json   (сколько игр, когда собрано)

on:
  schedule:
    - cron: '17 3 * * *'      # каждый день в 03:17 UTC (06:17 МСК)
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Полный обход: ~2000 вежливых запросов к поиску магазина. Магазин ограничивает
      # темп, поэтому на деле выходит 60–80 минут. Заодно пишется «база» обхода,
      # чтобы вторая языковая версия не обходила магазин заново.
      # Описания и разработчики берутся отдельным сервисом GetItems: 200 игр за запрос,
      # поэтому 20 000 самых заметных игр — это всего 100 запросов.
      - name: Каталог (русский) — обход магазина + описания
        run: |
          mkdir -p out
          python3 tools/build-catalog.py \
            --out out/catalog.ru.json.gz \
            --lang russian --cc RU \
            --details-top 20000 \
            --base "$RUNNER_TEMP/base.json" \
            --checkpoint "$RUNNER_TEMP/checkpoint.json"

      - name: Каталог (английский) — из той же базы, без обхода
        run: |
          python3 tools/build-catalog.py \
            --out out/catalog.en.json.gz \
            --lang english --cc US \
            --details-top 20000 \
            --base "$RUNNER_TEMP/base.json"

      - name: Публикация на GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/publish"
          mkdir -p "$PUB"
          cp out/catalog.ru.json.gz "$PUB/"
          cp out/catalog.en.json.gz "$PUB/"
          cp out/catalog.ru.json.gz "$PUB/catalog.json.gz"   # совместимость с 1.18.x
          python3 - "$PUB/catalog.meta.json" <<'PY'
          import gzip, json, os, sys, time
          ru = json.load(gzip.open('out/catalog.ru.json.gz', 'rt', encoding='utf-8'))
          en = json.load(gzip.open('out/catalog.en.json.gz', 'rt', encoding='utf-8'))
          meta = {
              'v': ru['v'],
              'utc': ru['utc'],
              'count': ru['count'],
              'details': ru.get('details', 0),
              'genres': ru['genres'],
              'files': {
                  'ru': {'count': ru['count'], 'size_gz': os.path.getsize('out/catalog.ru.json.gz')},
                  'en': {'count': en['count'], 'size_gz': os.path.getsize('out/catalog.en.json.gz')},
              },
              'built_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
          }
          json.dump(meta, open(sys.argv[1], 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('игр в каталоге:', meta['count'], '· с описанием:', meta['details'])
          print('ru', meta['files']['ru']['size_gz'], 'байт · en', meta['files']['en']['size_gz'], 'байт')
          PY

          cd "$PUB"
          git init -q -b gh-pages
          git add -A
          git -c user.name="Ludex" -c user.email="dev@ludex.local" commit -q -m "каталог $(date -u +%F)"
          # ветка каждый раз из одного коммита: история не растёт
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Файлы каталога (на случай разбора)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            out/catalog.ru.json.gz
            out/catalog.en.json.gz
          if-no-files-found: warn
          retention-days: 7
